<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>課題・小テスト管理（共有版）</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        input, textarea, select { width: 100%; margin: 5px 0; }
        button { margin-top: 10px; }
        .item { border: 1px solid #ccc; padding: 10px; margin: 10px 0; }

        #calendar { 
            display: grid; 
            grid-template-columns: repeat(7, 1fr); 
            gap: 5px; 
            margin-top: 20px;
        }
        .day {
            border: 1px solid #ccc;
            min-height: 80px;
            padding: 5px;
            font-size: 14px;
        }
        .day-header {
            font-weight: bold;
            text-align: center;
            margin-bottom: 5px;
        }
        .event {
            background: #f0f8ff;
            padding: 2px 4px;
            margin: 2px 0;
            border-radius: 3px;
            font-size: 12px;
        }

        #monthHeader {
            font-size: 20px;
            margin-top: 20px;
            margin-bottom: 10px;
        }
        #monthButtons {
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<h2>課題・小テストの追加（共有）</h2>

<select id="kind">
    <option value="課題">課題</option>
    <option value="小テスト">小テスト</option>
</select>

<select id="subject">
    <option value="現代国語">現代国語</option>
    <option value="言語文化">言語文化</option>
    <option value="論理表現">論理表現</option>
    <option value="数学Ⅰ">数学Ⅰ</option>
    <option value="数学A">数学A</option>
    <option value="物理">物理</option>
    <option value="生物">生物</option>
    <option value="歴史">歴史</option>
    <option value="コミュ英">コミュ英</option>
    <option value="情報">情報</option>
    <option value="家庭科">家庭科</option>
    <option value="保健">保健</option>
    <option value="体育">体育</option>
</select>

<input id="date" type="date">
