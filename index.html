<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>課題・小テスト管理（共有版）</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        input, textarea, select { width: 100%; margin: 5px 0; }
        button { margin-top: 10px; }
        .item { border: 1px solid #ccc; padding: 10px; margin: 10px 0; }

        #calendar { 
            display: grid; 
            grid-template-columns: repeat(7, 1fr); 
            gap: 5px; 
            margin-top: 20px;
        }
        .day {
            border: 1px solid #ccc;
            min-height: 80px;
            padding: 5px;
            font-size: 14px;
        }
        .day-header {
            font-weight: bold;
            text-align: center;
            margin-bottom: 5px;
        }
        .event {
            background: #f0f8ff;
            padding: 2px 4px;
            margin: 2px 0;
            border-radius: 3px;
            font-size: 12px;
        }

        #monthHeader {
            font-size: 20px;
            margin-top: 20px;
            margin-bottom: 10px;
        }
        #monthButtons {
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<h2>課題・小テストの追加（共有）</h2>

<select id="kind">
    <option value="課題">課題</option>
    <option value="小テスト">小テスト</option>
</select>

<select id="subject">
    <option value="現代国語">現代国語</option>
    <option value="言語文化">言語文化</option>
    <option value="論理表現">論理表現</option>
    <option value="数学Ⅰ">数学Ⅰ</option>
    <option value="数学A">数学A</option>
    <option value="物理">物理</option>
    <option value="生物">生物</option>
    <option value="歴史">歴史</option>
    <option value="コミュ英">コミュ英</option>
    <option value="情報">情報</option>
    <option value="家庭科">家庭科</option>
    <option value="保健">保健</option>
    <option value="体育">体育</option>
</select>

<input id="date" type="date">
<textarea id="detail" placeholder="内容メモ"></textarea>
<textarea id="subjectMemo" placeholder="教科ごとのメモ"></textarea>

<button onclick="addItem()">追加する</button>

<h2>一覧（共有）</h2>
<div id="list"></div>

<h2>カレンダー（共有）</h2>

<div id="monthHeader"></div>
<div id="monthButtons">
    <button onclick="prevMonth()">← 前の月</button>
    <button onclick="nextMonth()">次の月 →</button>
</div>

<div id="calendar"></div>

<a href="test.html">定期テスト一覧ページへ</a>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc }
        from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCsCJrtnRzsb_kAacqb2Q5JacJMNUP8C8w",
      authDomain: "schedulemanager-6c27d.firebaseapp.com",
      projectId: "schedulemanager-6c27d",
      storageBucket: "schedulemanager-6c27d.firebasestorage.app",
      messagingSenderId: "132654712821",
      appId: "1:132654712821:web:e47f43f3bf1e5d5ab9c2bc"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const tasksRef = collection(db, "tasks");

    let currentYear;
    let currentMonth;

    async function addItem() {
        const kind = document.getElementById("kind").value;
        const subject = document.getElementById("subject").value;
        const date = document.getElementById("date").value;
        const detail = document.getElementById("detail").value;
        const subjectMemo = document.getElementById("subjectMemo").value;

        if (!subject || !date) {
            alert("科目・日付は必須です");
            return;
        }

        await addDoc(tasksRef, {
            kind, subject, date, detail, subjectMemo
        });

        load();
    }

    async function load() {
        const list = document.getElementById("list");
        list.innerHTML = "";

        const snapshot = await getDocs(tasksRef);
        const tasks = [];

        snapshot.forEach(docSnap => {
            tasks.push({ id: docSnap.id, ...docSnap.data() });
        });

        tasks.forEach(item => {
            const div = document.createElement("div");
            div.className = "item";
            div.innerHTML = `
                <strong>${item.kind}</strong> (${item.subject})<br>
                日付: ${item.date}<br>
                教科メモ: ${item.subjectMemo || "（なし）"}<br>
                メモ: ${item.detail}<br>
                <button onclick="deleteItem('${item.id}')">削除</button>
            `;
            list.appendChild(div);
        });

        renderCalendar(tasks);
    }

    async function deleteItem(id) {
        await deleteDoc(doc(db, "tasks", id));
        load();
    }

    function renderCalendar(tasks) {
        const calendar = document.getElementById("calendar");
        calendar.innerHTML = "";

        const monthHeader = document.getElementById("monthHeader");
        monthHeader.textContent = `${currentYear}年 ${currentMonth + 1}月`;

        const firstDay = new Date(currentYear, currentMonth, 1);
        const lastDay = new Date(currentYear, currentMonth + 1, 0);
        const startWeekday = firstDay.getDay();
        const daysInMonth = lastDay.getDate();

        const weekdays = ["日", "月", "火", "水", "木", "金", "土"];
        weekdays.forEach(w => {
            const header = document.createElement("div");
            header.className = "day-header";
            header.textContent = w;
            calendar.appendChild(header);
        });

        for (let i = 0; i < startWeekday; i++) {
            const empty = document.createElement("div");
            empty.className = "day";
            calendar.appendChild(empty);
        }

        for (let day = 1; day <= daysInMonth; day++) {
            const cell = document.createElement("div");
            cell.className = "day";
            cell.innerHTML = `<strong>${day}</strong><br>`;

            const dateStr = `${currentYear}-${String(currentMonth + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;

            tasks.forEach(t => {
                if (t.date === dateStr) {
                    const event = document.createElement("div");
                    event.className = "event";
                    event.textContent = `${t.kind}: ${t.subject}`;
                    cell.appendChild(event);
                }
            });

            calendar.appendChild(cell);
        }
    }

    function prevMonth() {
        currentMonth--;
        if (currentMonth < 0) {
            currentMonth = 11;
            currentYear--;
        }
        load();
    }

    function nextMonth() {
        currentMonth++;
        if (currentMonth > 11) {
            currentMonth = 0;
            currentYear++;
        }
        load();
    }

    function initCalendar() {
        const today = new Date();
        currentYear = today.getFullYear();
        currentMonth = today.getMonth();
        load();
    }

    initCalendar();
</script>

</body>
</html>
